<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .voice { transform-box: fill-box; transform-origin: center; animation: voice 2.4s ease-in-out 2; }
    .voice:nth-child(2) { animation-delay: -0.3s; }
    .voice:nth-child(3) { animation-delay: -0.6s; }
    .voice:nth-child(4) { animation-delay: -0.9s; }
    .voice:nth-child(5) { animation-delay: -1.2s; }
    @keyframes voice { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
    @media (prefers-reduced-motion: reduce) { .voice { animation: none; } }
  </style>
  <rect width="64" height="64" rx="16" fill="#F6F6F2"/>
  <g fill="#20221F">
    <rect class="voice" x="13" y="26" width="6" height="12" rx="3"/>
    <rect class="voice" x="21" y="19" width="6" height="26" rx="3"/>
    <rect class="voice" x="29" y="13" width="6" height="38" rx="3"/>
    <rect class="voice" x="37" y="22" width="6" height="20" rx="3"/>
    <rect class="voice" x="45" y="27" width="6" height="10" rx="3"/>
  </g>
</svg>
