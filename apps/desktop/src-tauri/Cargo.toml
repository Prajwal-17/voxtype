[package]
name = "flow-desktop"
version = "0.1.0"
description = "Personal voice dictation for Ubuntu."
edition = "2021"
rust-version = "1.87"

[lib]
name = "flow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
earshot = "=1.2.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
nix = { version = "0.30", features = ["signal"] }
gio = "0.18"
glib = "0.18"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
