name: Check mobile

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - 'apps/api/src/modules/auth/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tests/mobile-*.test.ts'
      - '.github/workflows/check-mobile.yml'
      - '.github/workflows/mobile-dev-build.yaml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/api/src/modules/auth/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tests/mobile-*.test.ts'
      - '.github/workflows/check-mobile.yml'
      - '.github/workflows/mobile-dev-build.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/mobile-dev-build.yaml
    with:
      branch: ${{ github.sha }}
      api_url: https://voxtype-dev-tunnel.prajwal.sh
